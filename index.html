<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Curso de Física | 2° Bachillerato - Leyes de Newton, MRUA y Caída Libre</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #f0f4f8;
            color: #0f172a;
            line-height: 1.5;
        }

        .hero {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            padding: 2.5rem 2rem;
            text-align: center;
            border-bottom: 5px solid #3b82f6;
        }

        .hero h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        .hero p {
            font-size: 1.1rem;
            max-width: 700px;
            margin: 0.5rem auto;
            opacity: 0.9;
        }

        .hero-badge {
            background: #3b82f6;
            display: inline-block;
            padding: 0.3rem 1rem;
            border-radius: 2rem;
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: 1rem;
        }

        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        /* SECCIÓN TEÓRICA COMPLETA CON APUNTES */
        .theory-section {
            display: flex;
            flex-wrap: wrap;
            gap: 1.8rem;
            margin-bottom: 2.5rem;
        }

        .readings-card {
            flex: 1.2;
            background: white;
            border-radius: 1.2rem;
            padding: 1.5rem;
            box-shadow: 0 6px 14px -8px rgba(0,0,0,0.08);
            border: 1px solid #e2e8f0;
            max-height: 700px;
            overflow-y: auto;
        }

        .videos-card {
            flex: 1;
            background: white;
            border-radius: 1.2rem;
            padding: 1.5rem;
            box-shadow: 0 6px 14px -8px rgba(0,0,0,0.08);
            border: 1px solid #e2e8f0;
        }

        .section-title-custom {
            font-size: 1.3rem;
            font-weight: 700;
            color: #1e40af;
            border-left: 5px solid #3b82f6;
            padding-left: 0.8rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .reading-item {
            background: #f8fafc;
            padding: 0.8rem 1rem;
            border-radius: 0.8rem;
            margin-bottom: 1.2rem;
            border: 1px solid #e2e8f0;
        }

        .reading-item h4 {
            color: #0f172a;
            margin-bottom: 0.3rem;
            font-weight: 600;
        }

        .reading-item p {
            color: #475569;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .theory-content {
            font-size: 0.9rem;
            color: #1e293b;
            margin-top: 0.5rem;
        }

        .theory-content strong {
            color: #0f172a;
        }

        .theory-content .formula {
            font-family: monospace;
            background: #e6edf5;
            padding: 0.1rem 0.3rem;
            border-radius: 6px;
        }

        .reading-link {
            display: inline-block;
            margin-top: 0.3rem;
            color: #3b82f6;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.8rem;
        }

        .video-container {
            margin-bottom: 1.2rem;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 0.8rem;
            margin-bottom: 0.5rem;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-caption {
            font-size: 0.85rem;
            color: #475569;
            text-align: center;
            margin-top: 0.3rem;
        }

        /* Tarjetas de temas */
        .topics {
            display: flex;
            flex-wrap: wrap;
            gap: 1.2rem;
            justify-content: center;
            margin-bottom: 2.5rem;
        }

        .topic-card {
            background: white;
            border-radius: 1.2rem;
            padding: 1rem 1.5rem;
            flex: 1;
            min-width: 180px;
            text-align: center;
            box-shadow: 0 6px 12px -8px rgba(0,0,0,0.1);
            border: 1px solid #e2e8f0;
            transition: transform 0.2s;
        }

        .topic-card:hover {
            transform: translateY(-4px);
        }

        .topic-card h3 {
            color: #1e40af;
            margin-bottom: 0.4rem;
        }

        .topic-icon {
            font-size: 2rem;
            margin-bottom: 0.3rem;
        }

        /* Sección de ejercicios */
        .exercises-section {
            background: white;
            border-radius: 1.8rem;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.1);
            overflow: hidden;
            margin-top: 1rem;
        }

        .section-header {
            background: #f8fafc;
            padding: 1.2rem 2rem;
            border-bottom: 2px solid #e2e8f0;
        }

        .section-header h2 {
            font-size: 1.7rem;
            font-weight: 700;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .nav-exercises {
            background: #eef2ff;
            padding: 0.8rem 1.5rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            border-bottom: 1px solid #cbd5e1;
            justify-content: center;
        }

        .nav-exercises a {
            background: white;
            padding: 0.3rem 0.9rem;
            border-radius: 2rem;
            text-decoration: none;
            color: #1e293b;
            font-weight: 500;
            font-size: 0.85rem;
            border: 1px solid #cbd5e1;
            transition: 0.15s;
        }

        .nav-exercises a:hover {
            background: #1e293b;
            color: white;
        }

        .exercises-list {
            padding: 1.8rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
        }

        .exercise-block {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 1.2rem;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
            scroll-margin-top: 1rem;
        }

        .exercise-header {
            background: #fefce8;
            padding: 1rem 1.5rem;
            border-bottom: 2px solid #e2e8f0;
            border-radius: 1.2rem 1.2rem 0 0;
        }

        .exercise-number {
            font-weight: 800;
            font-size: 1.2rem;
            color: #1e40af;
            margin-bottom: 0.4rem;
        }

        .exercise-statement {
            font-size: 1rem;
            color: #0f172a;
            font-weight: 500;
            background: #fef9e3;
            padding: 0.7rem 1rem;
            border-radius: 0.8rem;
            border-left: 4px solid #f59e0b;
        }

        .solution-body {
            padding: 1.2rem 1.5rem 1.3rem;
            background: #f9fbfe;
        }

        .solution-title {
            font-weight: 700;
            color: #065f46;
            margin-bottom: 0.6rem;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .solution-title:before {
            content: "✓";
            background: #10b981;
            color: white;
            width: 1.3rem;
            height: 1.3rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 0.8rem;
        }

        .solution-step {
            color: #1e293b;
            font-size: 0.95rem;
        }

        .solution-step p {
            margin: 0.5rem 0;
        }

        .formula {
            font-family: 'Courier New', monospace;
            background: #e6edf5;
            padding: 0.2rem 0.4rem;
            border-radius: 8px;
            font-weight: 500;
            display: inline-block;
        }

        .back-ref {
            margin-top: 0.7rem;
            text-align: right;
            font-size: 0.7rem;
        }

        .back-ref a {
            color: #3b82f6;
            text-decoration: none;
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            font-size: 0.85rem;
            background: #f1f5f9;
            color: #334155;
            border-top: 1px solid #cbd5e1;
            margin-top: 2rem;
        }

        @media (max-width: 900px) {
            .theory-section {
                flex-direction: column;
            }
            .hero h1 {
                font-size: 1.6rem;
            }
            .exercises-list {
                padding: 1rem;
            }
            .exercise-header, .solution-body {
                padding: 1rem;
            }
            .readings-card {
                max-height: none;
            }
        }
    </style>
</head>
<body>
    <div class="hero">
        <h1>📘 Física 2° Bachillerato</h1>
        <p>Leyes de Newton · Movimientos acelerados (MRUA) · Caída libre y lanzamientos verticales</p>
        <div class="hero-badge">🎓 30 ejercicios resueltos paso a paso + Teoría completa + Videos</div>
    </div>

    <div class="main-container">
